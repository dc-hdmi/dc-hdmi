<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPTC 모험 모드 테스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #ffd57a;
    --red: #e35b5b;
    --green: #4bbf76;
    --blue: #4aa3d9;
  }
  html, body {
    margin: 0; padding: 0;
    background: #1a1a1a; color: #fff;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    user-select: none;
    min-height: 100vh;
  }
  #layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
    gap: 12px;
    padding: 10px;
  }
  @media (max-width: 800px) {
    #layout { grid-template-columns: 1fr; }
  }

  /* ───── 테스트 패널 ───── */
  .test-panel {
    background: #0e1f1a;
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    max-height: calc(100vh - 20px);
    position: sticky; top: 10px;
    align-self: start;
  }
  .test-panel h3 {
    color: var(--gold); font-size: 15px; margin: 0 0 10px;
    border-bottom: 1px solid #1f3028; padding-bottom: 6px;
  }
  .test-panel h4 {
    color: #88cc88; font-size: 12px; margin: 12px 0 4px;
    letter-spacing: 1px;
  }
  .test-panel button {
    display: block; width: 100%;
    background: linear-gradient(180deg, #2a3a32, #1a2a24);
    color: #fff; border: 1px solid #1f3028;
    padding: 6px 10px; margin: 3px 0;
    border-radius: 5px; cursor: pointer;
    font-size: 11px; font-weight: 600;
    text-align: left;
    transition: all 0.1s;
  }
  .test-panel button:hover { border-color: var(--gold); }
  .test-panel button:active { transform: scale(0.97); }
  .test-panel .btn-danger { background: #883333; }
  .test-panel input[type="number"] {
    width: 60px; padding: 4px 6px; margin: 2px 4px;
    background: #000; color: var(--gold); border: 1px solid #1f3028;
    border-radius: 4px;
  }
  .test-panel .inline-controls {
    display: flex; align-items: center; gap: 4px; margin: 4px 0;
    font-size: 11px;
  }

  /* ───── 뷰어 영역 ───── */
  .viewer {
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    min-height: 600px;
    max-height: calc(100vh - 20px);
    display: flex;
    flex-direction: column;
  }
  .viewer-header {
    background: #0e1f1a; color: var(--gold);
    padding: 8px 12px; font-size: 12px; font-weight: 700;
    border-bottom: 1px solid #1f3028;
  }
  .viewer-body {
    flex: 1; overflow: hidden;
    position: relative;
    background: #0a1612;
  }

  /* ───── 메인 메뉴 뷰 ───── */
  .main-menu-view {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #87ceeb 0%, #4a9fd9 50%, #2e86ab 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }
  .mode-button {
    width: 45%;
    aspect-ratio: 1;
    max-width: 200px;
    background-size: cover;
    background-position: center;
    border: 3px solid var(--gold);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    transition: transform 0.2s;
  }
  .mode-button:active { transform: scale(0.95); }
  .mode-button .mode-name {
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    text-shadow: 2px 2px 4px #000, 0 0 10px rgba(0,0,0,0.8);
    letter-spacing: 2px;
    z-index: 2;
    background: rgba(0,0,0,0.4);
    padding: 6px 14px;
    border-radius: 8px;
  }

  /* ───── 스테이지 선택 화면 ───── */
  .stage-view {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #1a5490 0%, #0e4a78 50%, #082040 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stage-topbar {
    position: absolute;
    top: 10px; left: 10px;
    z-index: 10;
  }
  .stage-botbar {
    position: absolute;
    bottom: 10px; left: 10px;
    z-index: 10;
  }
  .nav-btn {
    background: rgba(0,0,0,0.6);
    color: var(--gold);
    border: 1.5px solid var(--gold);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }
  .nav-btn:active { transform: scale(0.95); }

  .stage-scroll-wrap {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    display: flex;
    align-items: center;
    padding: 60px 20px;
    position: relative;
  }
  .stage-scroll-wrap::-webkit-scrollbar { display: none; }

  .stage-track {
    display: flex;
    gap: 0;
    align-items: center;
    padding: 0 40px;
  }

  .stage-cell {
    position: relative;
    width: 98px;
    height: 126px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: visible;
  }
  .stage-cell.active {
    cursor: pointer;
  }
  .stage-cell.locked {
    cursor: not-allowed;
  }
  .stage-cell.cleared {
    cursor: default;
  }
  .stage-cell .stage-name {
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 5px #000, 0 0 3px #000, 2px 2px 0 #000;
    letter-spacing: 0.5px;
    padding: 0 6px;
    line-height: 1.2;
  }
  .stage-cell.cleared::after {
    content: 'CLEAR';
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-size: 13px;
    font-weight: 900;
    text-shadow: 0 0 4px #000, 0 0 8px rgba(0,0,0,0.9);
    letter-spacing: 1.5px;
  }

  /* 스테이지 사이 — 진한 갈색 점선 */
  .wave-link {
    width: 130px;
    height: 0;
    flex-shrink: 0;
    border-top: 3px dashed #5a3315;
  }

  /* 잠금 흔들림 애니 */
  .stage-cell.unlocking {
    animation: lock-shake 0.9s ease-in-out;
  }
  @keyframes lock-shake {
    0%, 100% { transform: translateX(0); }
    10% { transform: translateX(-6px) rotate(-3deg); }
    20% { transform: translateX(6px) rotate(3deg); }
    30% { transform: translateX(-5px) rotate(-2deg); }
    40% { transform: translateX(5px) rotate(2deg); }
    50% { transform: translateX(-4px) rotate(-1deg); filter: brightness(1.5); }
    60% { transform: translateX(4px) rotate(1deg); filter: brightness(1.8); }
    70% { transform: translateX(-3px); filter: brightness(2); }
    80% { transform: translateX(3px); filter: brightness(1.5); }
    90% { transform: translateX(0); filter: brightness(1.2); }
  }
  .stage-cell.just-unlocked {
    animation: unlock-flash 0.5s ease-out;
  }
  @keyframes unlock-flash {
    0% { filter: brightness(2) drop-shadow(0 0 20px gold); }
    100% { filter: none; }
  }

  /* 노란 화살표 (상시 점프) */
  .arrow-indicator {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 17px solid #ffd57a;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
    animation: arrow-jump 0.9s ease-in-out infinite;
    z-index: 20;
  }
  @keyframes arrow-jump {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-12px); }
  }
  /* 셀 이동 중 화살표 — 큰 호 그리는 bounce */
  .arrow-indicator.traveling {
    transition: left 0.8s ease-in-out;
    animation: arrow-travel-jump 0.4s ease-in-out infinite;
  }
  @keyframes arrow-travel-jump {
    0%, 100% { transform: translateX(-50%) translateY(-5px); }
    50%      { transform: translateX(-50%) translateY(-30px); }
  }

  /* 샤터 조각 (스테이지 파괴) */
  .shatter-piece {
    position: absolute;
    overflow: hidden;
    background-size: 140px 180px;
    background-position: center;
    pointer-events: none;
  }

  /* ───── 보상 획득 알림 (하스스톤식) ───── */
  .reward-modal {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .reward-modal.show { display: flex; }
  .reward-rays {
    position: absolute;
    top: 50%; left: 50%;
    width: 10px; height: 10px;
    transform: translate(-50%, -50%);
    animation: reward-rays 2.5s ease-out forwards;
  }
  .reward-rays::before, .reward-rays::after {
    content: '';
    position: absolute; inset: 0;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(255,255,120,0.9) 15deg, transparent 30deg,
      transparent 90deg, rgba(255,220,80,0.7) 105deg, transparent 120deg,
      transparent 180deg, rgba(255,255,120,0.9) 195deg, transparent 210deg,
      transparent 270deg, rgba(255,220,80,0.7) 285deg, transparent 300deg,
      transparent 360deg);
    border-radius: 50%;
    animation: reward-spin 2.5s linear infinite;
    mix-blend-mode: screen;
  }
  .reward-rays::after { animation-direction: reverse; opacity: 0.5; }
  @keyframes reward-rays {
    0%   { opacity: 0; width: 10px; height: 10px; }
    30%  { opacity: 1; width: 800px; height: 800px; }
    100% { opacity: 0.3; width: 800px; height: 800px; }
  }
  @keyframes reward-spin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }
  .reward-card-wrap {
    position: relative;
    perspective: 1200px;
    z-index: 10;
    text-align: center;
  }
  .reward-card {
    width: 160px;
    aspect-ratio: 3/4;
    position: relative;
    transform-style: preserve-3d;
    animation: card-flip 1.8s ease-in-out 0.5s forwards;
    transform: rotateY(0);
  }
  @keyframes card-flip {
    0%   { transform: rotateY(0) scale(0.5); }
    30%  { transform: rotateY(180deg) scale(1); }
    60%  { transform: rotateY(360deg) scale(1.1); }
    80%  { transform: rotateY(540deg) scale(1.1); }
    100% { transform: rotateY(540deg) scale(1); }  /* 540 = 1.5바퀴 → 앞면 유지 */
  }
  .reward-card .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .reward-card .card-back-face {
    background: repeating-linear-gradient(45deg, #4a1515 0 8px, #2a0e0e 8px 16px);
    border: 3px solid #d9b64a;
    font-size: 48px;
    color: rgba(255,255,255,0.3);
    font-weight: 900;
  }
  .reward-card .card-front-face {
    background: linear-gradient(180deg, #1a2a24, #0e1812);
    border: 3px solid var(--gold);
    transform: rotateY(180deg);
    padding: 6px;
    flex-direction: column;
  }
  .reward-card .card-front-face img {
    width: 100%; height: 60%; object-fit: cover; border-radius: 6px;
  }
  .reward-card .card-front-face .r-name {
    color: #fff; font-size: 12px; font-weight: 700; margin-top: 4px; text-align: center;
  }
  .reward-card .card-front-face .r-stats {
    color: var(--gold); font-size: 14px; font-weight: 800;
    display: flex; gap: 10px; justify-content: center; margin-top: 4px;
  }
  .reward-text {
    color: var(--gold);
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-top: 20px;
    text-shadow: 0 0 10px #ff5500, 0 0 20px #ffee55, 0 4px 8px #000;
    animation: reward-text-pop 2s ease-out 1s forwards;
    opacity: 0;
  }
  @keyframes reward-text-pop {
    0% { opacity: 0; transform: scale(0.5); }
    40% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }
  .sparkle {
    position: absolute;
    width: 8px; height: 8px;
    background: radial-gradient(circle, #fff, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: sparkle 1.8s ease-out forwards;
  }
  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(0.5); }
  }
  .reward-close {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: #000;
    border: none;
    padding: 10px 24px;
    border-radius: 20px;
    font-weight: 900;
    cursor: pointer;
    z-index: 20;
    opacity: 0;
    animation: reward-close-show 0.4s ease-out 2.4s forwards;
  }
  @keyframes reward-close-show {
    to { opacity: 1; }
  }

  /* ───── 다이얼로그 ───── */
  .dialog-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 320;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .dialog-overlay.show { display: flex; }
  .dialog-box {
    background: #0e1f1a;
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 20px;
    max-width: 300px;
    text-align: center;
  }
  .dialog-box p {
    color: #fff; font-size: 14px; margin: 0 0 16px;
    line-height: 1.5;
  }
  .dialog-buttons {
    display: flex; gap: 8px; justify-content: center;
  }
  .dialog-buttons button {
    padding: 8px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 700;
  }
  .dialog-buttons .btn-ok {
    background: #c04040; color: #fff;
  }
  .dialog-buttons .btn-cancel {
    background: #444; color: #fff;
  }

  /* ───── 대전 중 하단 버튼 미리보기 ───── */
  .combat-bar-preview {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 6px; padding: 10px;
    background: #0e1f1a; border-top: 1px solid #1f3028;
  }
  .combat-bar-preview button {
    flex: 1;
    background: linear-gradient(180deg, #f2c15b, #c98f2a);
    color: #1a1207;
    border: none; padding: 10px;
    font-size: 14px; font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
  }
  .combat-bar-preview .log-btn {
    flex: 0 0 auto; width: 44px;
    background: #2a3a32; color: #fff;
    font-size: 16px;
  }
  .combat-bar-preview .back-btn {
    background: #4a6b58; color: #fff;
  }

  /* ───── 데이터 테이블 ───── */
  .data-table {
    width: 100%; border-collapse: collapse;
    font-size: 11px; color: #fff;
    background: #0a1612;
  }
  .data-table th, .data-table td {
    border: 1px solid #1f3028; padding: 5px 8px; text-align: left;
  }
  .data-table th { background: #1f3028; color: var(--gold); }
  .data-table td img { width: 32px; height: 32px; vertical-align: middle; }
  .data-content {
    padding: 10px; overflow-y: auto; height: 100%;
  }

  /* 색상 샘플 */
  .gradient-sample {
    width: 100%; height: 60px; border-radius: 6px;
    margin: 4px 0; display: flex; align-items: center;
    padding-left: 12px; color: #fff; font-weight: 700;
    text-shadow: 1px 1px 2px #000;
  }

  /* 상태 메시지 */
  .status-msg {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.9);
    color: var(--gold);
    padding: 8px 14px;
    border: 1px solid var(--gold);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    z-index: 400;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status-msg.show { opacity: 1; }
</style>
</head>
<body>
<div id="layout">
  <!-- 테스트 패널 -->
  <div class="test-panel">
    <h3>🧪 모험 모드 테스트</h3>

    <h4>🎨 UI 뷰</h4>
    <button data-view="main-menu">① 메인 메뉴 보기</button>
    <button data-view="stage-select">② 스테이지 선택 보기</button>
    <button data-view="combat-bar">③ 대전 중 하단 버튼</button>

    <h4>🏷 스테이지 상태 시뮬</h4>
    <div class="inline-controls">
      N단계까지 클리어:
      <input type="number" id="clear-count" min="0" max="10" value="0">
      <button data-action="apply-clear" style="width:auto; padding: 4px 8px; margin:0;">적용</button>
    </div>
    <button data-action="all-locked">전부 잠김</button>
    <button data-action="all-cleared">전부 클리어</button>

    <h4>🎬 이펙트</h4>
    <button data-action="first-enter">최초 진입 (잠금 풀림)</button>
    <button data-action="clear-sequence">클리어 복귀 시퀀스 (4초)</button>
    <button data-action="reward-modal">보상 획득 알림 (하스스톤식)</button>

    <h4>🔘 다이얼로그</h4>
    <button data-action="reset-dialog">처음부터 리셋 다이얼로그</button>
    <button data-action="back-dialog">돌아가기 다이얼로그</button>

    <h4>💾 localStorage</h4>
    <button data-action="save-storage">현재 상태 저장</button>
    <button data-action="load-storage">저장된 상태 불러오기</button>
    <button data-action="clear-storage" class="btn-danger">저장 삭제</button>

    <h4>📊 데이터 조회</h4>
    <button data-view="data-bosses">보스 10명 정보표</button>
    <button data-view="data-rewards">보상 캐릭 10명 정보표</button>
    <button data-view="data-gradients">스테이지 색상 샘플</button>

    <h4>🔄 전체 흐름</h4>
    <button data-action="full-flow">전체 흐름 자동 시뮬</button>
  </div>

  <!-- 뷰어 -->
  <div class="viewer">
    <div class="viewer-header" id="viewer-header">(테스트 버튼 선택)</div>
    <div class="viewer-body" id="viewer-body"></div>
    <div class="status-msg" id="status-msg"></div>
  </div>
</div>

<script>
// ─────────── 데이터 ───────────
const BOSSES = [
  { stage: 1, name: '이스트 블루', bossName: '아론',       bossId: 3428, atk: 4, hp: 11, attr: 'STR', cls: 'Powerhouse/Slasher',  gradient: 'linear-gradient(180deg, #2e86ab, #004466)' },
  { stage: 2, name: '알라바스타',  bossName: '크로커다일', bossId: 4274, atk: 6, hp: 16, attr: 'DEX', cls: 'Cerebral/Driven',     gradient: 'linear-gradient(180deg, #d4a574, #8b5a2b)' },
  { stage: 3, name: '하늘섬',      bossName: '에넬',       bossId: 4579, atk: 7, hp: 19, attr: 'PSY', cls: 'Driven/Striker',      gradient: 'linear-gradient(180deg, #c8e4f8, #ffffff)' },
  { stage: 4, name: '워터 세븐',   bossName: '블루노',     bossId: 756,  atk: 6, hp: 20, attr: 'INT', cls: 'Powerhouse/FreeSpirit', gradient: 'linear-gradient(180deg, #4a9d9c, #1a4040)' },
  { stage: 5, name: '에니에스 로비', bossName: '롭 루치',   bossId: 4170, atk: 9, hp: 25, attr: 'DEX', cls: 'Powerhouse/Shooter',  gradient: 'linear-gradient(180deg, #d0d0d0, #6a6a6a)' },

function thumbUrl(id) {
  const padded = String(id).padStart(4, '0');
  const d1 = padded[0];
  const bucket = String(Math.floor(id / 100) * 100 % 1000).padStart(3, '0');
  return `${THUMB_BASE}/${d1}/${bucket}/${padded}.png`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function animateScroll(el, from, to, duration) {
  return new Promise(resolve => {
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      // easeOutQuad
      const eased = 1 - (1 - t) * (1 - t);
      el.scrollLeft = from + (to - from) * eased;
      if (t < 1) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });
}

function showStatus(text) {
  const el = document.getElementById('status-msg');
  el.textContent = text;
  el.classList.add('show');

}

async function playClearSequence() {
  if (currentClearCount >= 10) {
    showStatus('이미 전체 클리어');
    return;
  }
  showView('stage-select');
  await sleep(300);

  const clearingStage = currentClearCount + 1;
  const clearingCell = document.querySelector(`.stage-cell[data-stage="${clearingStage}"]`);
  if (!clearingCell) return;

  // 셀 안의 화살표 제거 (바로 떼어내서 scroll wrap 쪽으로 이동)
  const arrowInCell = clearingCell.querySelector('.arrow-indicator');
  if (arrowInCell) arrowInCell.remove();

  // 1. 샤터 (약 0.9초)
  await shatterCell(clearingCell);
  clearingCell.className = 'stage-cell cleared';
  clearingCell.style.backgroundImage = `url('${IMG.cellCleared}')`;
  clearingCell.innerHTML = '';
  // CLEAR 전환 결과 확인 시간
  await sleep(1200);

  const nextStage = clearingStage + 1;
  if (nextStage > 10) {
    showStatus('최종 스테이지 클리어');
    currentClearCount = clearingStage;
    return;
  }
  const nextCell = document.querySelector(`.stage-cell[data-stage="${nextStage}"]`);
  if (!nextCell) return;

  // 2. 화살표 생성 — scroll wrap 기준 absolute. 스크롤 자동 이동 X (화살표 따라 함께 이동)
  const scrollWrap = document.getElementById('stage-scroll');
  const srcRect = clearingCell.getBoundingClientRect();
  const wrapRect = scrollWrap.getBoundingClientRect();
  const srcX = (srcRect.left + srcRect.width / 2) - wrapRect.left + scrollWrap.scrollLeft;
  const yTop = (srcRect.top - wrapRect.top) - 30;

  // 다음 셀 content 좌표 (현재 스크롤 상태 기준으로 계산)
  const dstRectInitial = nextCell.getBoundingClientRect();
  const dstX = (dstRectInitial.left + dstRectInitial.width / 2) - wrapRect.left + scrollWrap.scrollLeft;

  // 다음 셀이 scroll wrap 중앙에 오도록 하는 scrollLeft 목표
  const dstScroll = Math.max(0, dstX - scrollWrap.clientWidth / 2);
  const srcScroll = scrollWrap.scrollLeft;

  const travelArrow = document.createElement('div');
  travelArrow.className = 'arrow-indicator';
  travelArrow.style.cssText = `position:absolute; top:${yTop}px; left:${srcX}px; animation:none; z-index:50;`;
  scrollWrap.appendChild(travelArrow);
  await sleep(400);  // 화살표 등장 인식 시간

  // 5번 점프하며 이동 (각 600ms, 스크롤도 함께 비례 이동)
  const steps = 5;
  const stepDur = 600;
  for (let i = 0; i < steps; i++) {
    const t = (i + 1) / steps;
    const nextX = srcX + ((dstX - srcX) * t);
    const nextScroll = srcScroll + ((dstScroll - srcScroll) * t);
    const curX = travelArrow.style.left;

    // 화살표 + 스크롤 동시 애니
    const arrowAnim = travelArrow.animate([
      { left: curX, transform: 'translateX(-50%) translateY(0)' },
      { transform: 'translateX(-50%) translateY(-30px)', offset: 0.5 },
      { left: nextX + 'px', transform: 'translateX(-50%) translateY(0)' },
    ], { duration: stepDur, easing: 'ease-out', fill: 'forwards' });

    const scrollAnim = animateScroll(scrollWrap, scrollWrap.scrollLeft, nextScroll, stepDur);
    await Promise.all([arrowAnim.finished, scrollAnim]);
    travelArrow.style.left = nextX + 'px';
  }
  await sleep(500);
  travelArrow.remove();

  // 4. 다음 셀 잠김 흔들림 → 풀림 (좀 더 길게)
  nextCell.classList.add('unlocking');
  await sleep(1200);
  nextCell.classList.remove('unlocking');
  nextCell.className = 'stage-cell active just-unlocked';
  nextCell.style.backgroundImage = `url('${IMG.cellActive}')`;
  nextCell.innerHTML = `<div class="stage-name">${BOSSES[nextStage-1].name}</div><div class="arrow-indicator"></div>`;
  await sleep(1000);
  nextCell.classList.remove('just-unlocked');

  currentClearCount = clearingStage;
  showStatus(`${clearingStage}단계 클리어 — 다음 단계 ${nextStage} 활성화`);
}

async function shatterCell(cell) {
  const rect = cell.getBoundingClientRect();
  const parent = cell.parentElement.parentElement;  // scroll wrap
  const parentRect = parent.getBoundingClientRect();
  const bgImg = cell.style.backgroundImage;
  const container = document.createElement('div');
  container.style.cssText = `position:absolute; left:${rect.left - parentRect.left + parent.scrollLeft}px; top:${rect.top - parentRect.top}px; width:${rect.width}px; height:${rect.height}px; pointer-events:none; z-index:30;`;
  parent.appendChild(container);
  cell.style.visibility = 'hidden';
  const clips = [
    'polygon(0 0, 55% 0, 45% 50%, 0 60%)',
    'polygon(55% 0, 100% 0, 100% 55%, 45% 50%)',
    'polygon(0 60%, 45% 50%, 55% 100%, 0 100%)',
    'polygon(45% 50%, 100% 55%, 100% 100%, 55% 100%)',
  ];
  const anims = clips.map((clip, i) => {
    const p = document.createElement('div');
    p.style.cssText = `position:absolute; inset:0; background-image:${bgImg}; background-size:cover; clip-path:${clip};`;
    container.appendChild(p);
    const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const dist = 60;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    const rot = (Math.random() - 0.5) * 120;
    return p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy+30}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 650, easing: 'cubic-bezier(0.3, 0.2, 0.6, 1)', fill: 'forwards' }).finished;
  });
  await Promise.all(anims);
  container.remove();
  cell.style.visibility = '';
}

// ─────────── 보상 획득 알림 ───────────
let rewardIdx = 0;
async function showRewardModal() {
  const body = document.getElementById('viewer-body');
  const reward = REWARDS[rewardIdx % REWARDS.length];
  const url = thumbUrl(reward.id);
  const modal = document.createElement('div');
  modal.className = 'reward-modal show';
  modal.innerHTML = `
    <div class="reward-rays"></div>
    <div class="reward-card-wrap">
      <div class="reward-card">
        <div class="card-face card-back-face">?</div>
        <div class="card-face card-front-face">
          <img src="${url}" alt="${reward.charName}" onerror="this.style.display='none'">
          <div class="r-name">${reward.charName.length > 20 ? reward.charName.slice(0, 20) + '…' : reward.charName}</div>
          <div class="r-stats"><span>⚔${reward.atk}</span><span>♥${reward.hp}</span></div>
        </div>
      </div>
      <div class="reward-text">NEW CARD!</div>
    </div>
    <button class="reward-close">확인</button>
  `;
  body.appendChild(modal);
  // sparkle 추가
  for (let i = 0; i < 20; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.style.cssText = `left:${30 + Math.random()*40}%; top:${30 + Math.random()*40}%; animation-delay:${Math.random()*1.5}s;`;
    modal.appendChild(sp);
  }
  modal.querySelector('.reward-close').addEventListener('click', () => modal.remove());
  rewardIdx++;
  showStatus(`보상: ${reward.label} (스테이지 ${reward.stage})`);
}

// ─────────── 다이얼로그 ───────────
function showDialog(msg, onOk) {
  const body = document.getElementById('viewer-body');
  const dlg = document.createElement('div');
  dlg.className = 'dialog-overlay show';
  dlg.innerHTML = `
    <div class="dialog-box">
      <p>${msg}</p>
      <div class="dialog-buttons">
        <button class="btn-cancel">취소</button>
        <button class="btn-ok">확인</button>
      </div>
    </div>
  `;
  body.appendChild(dlg);
  dlg.querySelector('.btn-cancel').addEventListener('click', () => dlg.remove());
  dlg.querySelector('.btn-ok').addEventListener('click', () => {
    dlg.remove();
    if (onOk) onOk();
  });
}

function showResetDialog() {
  showDialog('지금까지의 모든 진행이 사라집니다.<br>정말 초기화하시겠습니까?', () => {
    currentClearCount = 0;
    localStorage.removeItem(STORAGE_KEY);
    showView('stage-select');
    showStatus('진행 초기화됨');
  });
}

function showBackDialog() {
  showDialog('현재 플레이 상태가 사라집니다.<br>돌아가시겠습니까?', () => {
    showView('stage-select');
    showStatus('스테이지 화면 복귀 (대전 상태 폐기)');
  });
}

// ─────────── localStorage ───────────
function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ clearCount: currentClearCount, savedAt: new Date().toISOString() }));
  showStatus(`저장 완료: ${currentClearCount}단계 클리어 상태`);
}
function loadStorage() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) { showStatus('저장된 상태 없음'); return; }
  const data = JSON.parse(raw);
  currentClearCount = data.clearCount || 0;
  document.getElementById('clear-count').value = currentClearCount;
  showView('stage-select');
  showStatus(`불러옴: ${currentClearCount}단계 (저장 시각: ${data.savedAt?.slice(0, 19) || 'N/A'})`);
}
function clearStorage() {
  localStorage.removeItem(STORAGE_KEY);
  showStatus('저장 삭제됨');
}

// ─────────── 전체 흐름 자동 ───────────
async function fullFlow() {
  showStatus('전체 흐름 시뮬 시작');
  // 1. 메인 메뉴
  showView('main-menu');
  await sleep(2000);
  // 2. 스테이지 선택 (최초, clearCount=0)
  currentClearCount = 0;
  await playFirstEnter();
  await sleep(1500);
  // 3. 1단계 클리어 → 복귀 시퀀스
  await playClearSequence();
  await sleep(1000);
  // 4. 보상 획득 알림
  rewardIdx = 1;  // 조로
  await showRewardModal();
  await sleep(3500);
  document.querySelector('.reward-modal')?.remove();
  showStatus('흐름 시뮬 완료');
}

// ─────────── 액션 바인딩 ───────────
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.dataset.action;
    if (act === 'apply-clear') {
      currentClearCount = parseInt(document.getElementById('clear-count').value) || 0;
      showView('stage-select');
    }
    if (act === 'all-locked') { currentClearCount = -1; document.getElementById('clear-count').value = 0; showView('stage-select'); }
    if (act === 'all-cleared') { currentClearCount = 10; document.getElementById('clear-count').value = 10; showView('stage-select'); }
    if (act === 'first-enter') playFirstEnter();
    if (act === 'clear-sequence') playClearSequence();
    if (act === 'reward-modal') showRewardModal();
    if (act === 'reset-dialog') showResetDialog();
    if (act === 'back-dialog') showBackDialog();
    if (act === 'save-storage') saveStorage();
    if (act === 'load-storage') loadStorage();
    if (act === 'clear-storage') clearStorage();
    if (act === 'full-flow') fullFlow();
  });
});

// 초기 뷰
showView('main-menu');
</script>
</body>
</html>
